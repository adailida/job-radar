# job-radar's default settings: every setting there is, with its default.
# The app reads this file first. Put only what you change in local/settings.yaml:
# it is merged over this one, at any depth. Unknown keys there are errors.

output: output            # run folders go under output/runs/, demo runs under output/demo/
lookback_days: 14         # how far back a run may reach: a first run, or after a long break
new_only: true            # drop jobs an earlier run already found; false ranks them again
trend_period: month       # week, month or quarter: the periods market trends compare,
                          # and how long the "What employers ask for" window is

llm:
  model: haiku            # the Claude model that scores jobs
  timeout_seconds: 120    # how long to wait for one answer
  batch_size: 20          # jobs per prompt
  max_description_chars: 4000  # how much of each description the model sees
  classify_batch_size: 50 # jobs per prompt when labelling seniority, job type and domain
  classify_description_chars: 1000  # labelling reads only the start of each description
  extract_batch_size: 10  # jobs per prompt when finding what matched jobs ask for
  extract_description_chars: 8000  # how much of each description that reads
  max_jobs_per_run: 60    # a safety cap: over this many jobs for the LLM, the run asks
                          # whether to send them all, only the first ones, or stop

# What the LLM labels each job with. The descriptions guide it; searches and the
# report use the names. Change, add or remove entries freely.
job_types:
  engineering: "builds software: backend, frontend, full stack, mobile, platform, infrastructure, data or ML engineering"
  engineering-management: "leads engineers: engineering manager, head or director of engineering, CTO"
  product: "product management or product design"
  data: "data analysis, analytics or data science, not mainly building software"
  security: "information security, security engineering or IT security"
  it-operations: "IT support, systems administration, DevOps operations"
domains:
  climate: "climate change mitigation and adaptation, energy, conservation"
  health: "health care, public health, global health"
  education: "education and learning"
  civic: "government, public services, civic tech, democracy"
  justice: "criminal justice, legal aid, human rights"
  economic-opportunity: "jobs, financial inclusion, poverty, housing"
  humanitarian: "humanitarian aid, refugees, international development"
  ai-safety: "AI safety, AI governance, responsible AI"
  commercial: "a business with no particular social mission"

recommend:
  top_n: 10               # at most this many jobs in the report
  min_score: 40           # 0 to 100; a lower score is a poor fit and isn't recommended

report:
  group_by: job_type      # job_type, domain or both (domains inside job types): headings in "New openings"
  requirements_per_type: 20  # rows per type (skills, tools, certifications, years) in "What employers ask for"
  gap_suggestions: 5      # the most asked gaps shown with how to gain them in "Experience to gain"

alerts:
  low_credits: 100        # warn when a paid source has fewer credits than this left after a run

sources:
  getro:
    network: "997"        # the Getro job board to fetch: 997 is Fast Forward
  jobspipe:               # a paid API: LinkedIn, Indeed and employers' own ATS
    enabled: false        # on needs JOBSPIPE_API_KEY in the environment or .env
    api_key_env: JOBSPIPE_API_KEY
    plan: free            # free: 1,000 credits once, 250 a run; seeker: 10,000 a month, 2,500 a run
    max_jobs_per_run: null  # the per-run max in credits (one a job); null takes the plan's
    monthly_budget: null  # credits a month; null takes the plan's (free has no monthly reset)
    delay_seconds: 1.0    # between requests
    match_if_missing: true  # also ask for jobs that don't say; false costs fewer credits
    filters: {}           # JobsPipe-only filters, sent as written, e.g.
                          #   occupation_code_or: ["25"], employer_type_not: [agency, broker],
                          #   max_ghost_score: 40, description_phrase_or: [nonprofit organization]
