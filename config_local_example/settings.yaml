# Your settings: only what you change. The app reads config/settings.yaml first
# (every setting, with its default) and merges this file over it, at any depth,
# with the same keys. Unknown keys here are errors. A few common ones:

lookback_days: 7          # how far back a first run, or one after a break, reaches (14 by default)

recommend:
  top_n: 5                # at most this many jobs in the report (10 by default)

# llm:
#   max_jobs_per_run: 20  # a safety cap on jobs sent to Claude in one run (60 by default)

# JobsPipe, a paid source, is off by default. To turn it on, set JOBSPIPE_API_KEY
# in config_local/.env and start with a low per-run max:
# sources:
#   jobspipe:
#     enabled: true
#     max_jobs_per_run: 25  # credits a run, one a job
